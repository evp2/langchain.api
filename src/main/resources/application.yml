spring:
  application:
    name: langchain.api
  # ---- MCP server (Spring AI) ----
  # Exposes the review services as MCP tools (see mcp/ReviewMcpTools) over Streamable-HTTP at the
  # default /mcp endpoint, on this same servlet port. Lets MCP clients (Claude Code / Desktop, IDE
  # agents) invoke analyze_pr / submit_review / get_review / synthesize as tools.
  ai:
    mcp:
      server:
        name: langchain-review
        version: 0.0.1
        protocol: STREAMABLE   # current MCP standard (SSE is deprecated in Spring AI 2.0)
        type: SYNC             # tools call blocking services
        instructions: >
          Resiliency-focused multi-agent review of a GitHub pull request (change-risk,
          configuration, observability) producing a GO / CONDITIONAL / NO_GO verdict.
        annotation-scanner:
          enabled: true

server:
  port: 8080
  # Behind the Coder HTTPS proxy: honor X-Forwarded-* headers so generated URLs
  # (e.g. the OpenAPI "server" URL Swagger UI calls) use the external https host.
  forward-headers-strategy: framework

# ---- Logging ----
# Structured (JSON) logging for the console appender. Each API call is logged as a single
# "http.request" event by RequestLoggingFilter; every line carries the request's `requestId`
# (from the MDC) so one call is traceable across log lines. Override the format via the
# LOGGING_STRUCTURED_FORMAT_CONSOLE env var (ecs | logstash | gelf); leave blank for plain text.
logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:ecs}

# ---- CORS ----
# Origins allowed to call the API from a browser (Swagger UI, separate frontend, etc.).
# Comma-separated list; supports patterns (e.g. https://*.example.com).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# ---- Swagger / OpenAPI ----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Hide the "Schemas" section at the bottom of the page.
    default-models-expand-depth: -1
  api-docs:
    path: /v3/api-docs

# ---- AWS Bedrock (Anthropic application inference profiles) ----
# Each review sub-agent is configured independently. By default every agent uses the shared
# INFERENCE_PROFILE_ARN, but any agent can be pointed at a different profile / tuned separately
# via its own env vars (e.g. RISK_INFERENCE_PROFILE_ARN, SYNTHESIZER_TEMPERATURE) or by editing
# the values below. Export INFERENCE_PROFILE_ARN before starting the app.
bedrock:
  region: ${AWS_REGION:us-east-1}
  # Per-call timeout for a single Bedrock invocation. The SDK default is 60s, but a large-diff
  # completion can far exceed that and get aborted mid-call; keep this above the slowest model.
  call-timeout-seconds: ${BEDROCK_CALL_TIMEOUT_SECONDS:280}
  # Retries per Bedrock call. Kept low so a slow call's retries don't exhaust the review budget.
  max-retries: ${BEDROCK_MAX_RETRIES:1}
  # Selectable model backends (see the `model` request param / ModelChoice enum). Claude Sonnet
  # defaults to the shared INFERENCE_PROFILE_ARN; Nemotron must be set explicitly since no
  # inference profile exists for it in this account (raw Bedrock model id).
  models:
    claude-sonnet: ${CLAUDE_SONNET_INFERENCE_PROFILE_ARN:${INFERENCE_PROFILE_ARN}}
    nvidia-nemotron: ${NVIDIA_NEMOTRON_MODEL_ID:${INFERENCE_PROFILE_ARN_2}}
  risk:
    model-arn: ${RISK_INFERENCE_PROFILE_ARN:${INFERENCE_PROFILE_ARN}}
    temperature: ${RISK_TEMPERATURE:0.2}
    max-output-tokens: ${RISK_MAX_OUTPUT_TOKENS:8192}
  configuration:
    model-arn: ${CONFIGURATION_INFERENCE_PROFILE_ARN:${INFERENCE_PROFILE_ARN}}
    temperature: ${CONFIGURATION_TEMPERATURE:0.2}
    max-output-tokens: ${CONFIGURATION_MAX_OUTPUT_TOKENS:8192}
  observability:
    model-arn: ${OBSERVABILITY_INFERENCE_PROFILE_ARN:${INFERENCE_PROFILE_ARN}}
    temperature: ${OBSERVABILITY_TEMPERATURE:0.2}
    max-output-tokens: ${OBSERVABILITY_MAX_OUTPUT_TOKENS:8192}
  synthesizer:
    model-arn: ${SYNTHESIZER_INFERENCE_PROFILE_ARN:${INFERENCE_PROFILE_ARN}}
    temperature: ${SYNTHESIZER_TEMPERATURE:0.3}
    max-output-tokens: ${SYNTHESIZER_MAX_OUTPUT_TOKENS:8192}

# ---- Review orchestration ----
review:
  # Hard cap on diff characters sent to the models (protects against huge PRs).
  max-diff-chars: 64000
  # Overall timeout for a single review request. Must exceed the slowest specialist's worst case
  # (bedrock.call-timeout-seconds x its retries) so large PRs finish instead of degrading.
  timeout-seconds: 700

# GitHub token is read from the GITHUB_TOKEN / GH_TOKEN environment variable at runtime
# (optional for public repos, required for private repos and to avoid low rate limits).
