# Test profile: no live AWS calls.
# Dummy inference-profile ARN so the context loads without the real env var; building the
# Bedrock client with this id makes no network call — it would only fail on invoke.
INFERENCE_PROFILE_ARN=arn:aws:bedrock:us-east-1:000000000000:application-inference-profile/test-dummy
# Skip the startup STS GetCallerIdentity check.
aws.health-check.enabled=false
